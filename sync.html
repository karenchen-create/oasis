<script>
/* 把原本 claude.ai 的 db / downloads 換成 Firebase Firestore 與一般瀏覽器下載 */
(function(){
  let fsdb = null;
  try{
    const c = window.FIREBASE_CONFIG || {};
    if(c.apiKey && c.projectId && window.firebase){
      firebase.initializeApp(c);
      fsdb = firebase.firestore();
      fsdb.settings({ ignoreUndefinedProperties:true, experimentalAutoDetectLongPolling:true, merge:true });
    }
  }catch(e){ console.error("Firebase 初始化失敗", e); fsdb = null; }
  const downloads = { save: async ({ filename, data }) => {
    const blob = data instanceof Blob ? data : new Blob([data], { type: /\.json$/i.test(filename) ? "application/json" : "text/csv;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  } };
  window.claude = { use: async name => name === "db" ? fsdb : name === "downloads" ? downloads : null };
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
:root{
  --night:#0a1016; --panel:#16212a; --panel2:#1d2a34; --line:#2a3a46;
  --fg:#eef3f4; --muted:#93a6ae; --dim:#61747d; --glow2:#ffe7a3;
  --yellow:#f3c531; --orange:#ff8b3d; --red:#ff4e55; --green:#3fd08f;
  --gov:#b9a2ff; --tech:#56d0e4; --soc:#ff9db1;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-story:"Noto Serif TC","Noto Sans TC",serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--night);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
button.primary{background:var(--yellow);color:#1a1500;border-color:var(--yellow);font-weight:700}
button.sel{background:var(--fg);color:var(--night);border-color:var(--fg)}
input,textarea{background:#0d151b;border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
textarea{min-height:60px;resize:vertical}
h1,h2,h3{margin:0;text-wrap:balance} p{margin:0} a{color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;border:1px solid var(--line);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block}
.g-gov{color:var(--gov)} .g-tech{color:var(--tech)} .g-soc{color:var(--soc)}
.ok{color:var(--green)} .warn{color:var(--yellow)} .bad{color:var(--red)}
.banner{border:1px solid var(--orange);color:var(--orange);background:#2a1a10;border-radius:12px;padding:10px 14px;margin-bottom:12px}
.blink{animation:flash 1s ease-in-out infinite} @keyframes flash{50%{opacity:.3}}
@keyframes blink{to{visibility:hidden}}
.landing{max-width:960px;margin:4vh auto 0;display:grid;gap:24px}
.landing h1{font-family:var(--f-story);font-size:clamp(30px,5.4vw,54px);font-weight:900;line-height:1.15}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.role{display:grid;gap:4px;text-align:left;padding:18px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-decoration:none;color:var(--fg)}
.role b{font-size:19px} .role.main{border-color:var(--glow2);background:linear-gradient(160deg,#2a2615,var(--panel) 60%)}
.foot{font-size:11.5px;color:var(--dim);text-align:center;margin-top:18px}

/* 店長畫面 */
.wrap{max-width:860px;margin:0 auto;display:grid;gap:12px}
.hud{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:20;background:var(--night);padding-block:8px;margin-top:-8px}
.hud .clock{font-family:var(--f-num);font-size:20px;font-weight:600}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tabs button{border-radius:999px;position:relative;padding:9px 6px;font-weight:700}
.tabs button.on{background:var(--fg);color:var(--night);border-color:var(--fg)}
.badge{position:absolute;top:-6px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}

/* 供需平衡 */
.bal{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:12px}
.bal.ok{border-left-color:var(--green)} .bal.bad{border-left-color:var(--red)}
.bal-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.verdict{font-size:clamp(20px,4.6vw,26px);font-weight:900;line-height:1.25}
.bal-num{font-family:var(--f-num);text-align:right;line-height:1.05;white-space:nowrap}
.bal-num b{font-size:clamp(24px,5vw,32px);font-weight:600;display:block}
.bal-num span{font-size:11.5px;color:var(--muted)}
.unmet{display:flex;flex-wrap:wrap;gap:6px}
.unmet span{font-size:13px;border-radius:8px;padding:3px 9px;background:#2a1013;border:1px solid #5a2228;color:#ffb3b7}
.unmet span.hid{background:transparent;border-style:dashed;color:var(--muted)}
.delta{font-size:12.5px;border-radius:999px;padding:1px 9px;border:1px solid currentColor;display:inline-block;animation:dpop .4s ease-out}
@keyframes dpop{from{transform:scale(1.25);opacity:0}}
.sd{display:grid;gap:6px}
.sd-row{display:grid;grid-template-columns:2.6em minmax(0,1fr) 5.6em;gap:8px;align-items:center}
.sd-row .lbl{font-size:14px;font-weight:700}
.sd-row .val{font-family:var(--f-num);font-size:14px;text-align:right}
.track{position:relative;height:26px;border-radius:7px;background:#0d151b;border:1px solid var(--line);overflow:hidden;display:flex}
.track i{height:100%;display:block;flex:none;transition:width .6s;border-right:1px solid rgba(10,16,22,.6)}
.pend{background-image:repeating-linear-gradient(45deg,rgba(10,16,22,.75) 0 5px,transparent 5px 10px)!important}
.ghost{background:repeating-linear-gradient(45deg,rgba(255,78,85,.55) 0 5px,transparent 5px 10px)!important;border:1px dashed var(--red)}
.track .mark{position:absolute;top:-2px;bottom:-2px;border-left:2px dashed var(--fg);z-index:2}
.legend{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px;color:var(--muted);padding-left:calc(2.6em + 8px)}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend s{color:var(--dim)}
.tl{position:relative;height:16px;border-radius:8px;background:#0d151b;border:1px solid var(--line)}
.tl i{position:absolute;top:0;bottom:0;display:block}
.tl .lit{background:var(--glow2)} .tl .off{background:var(--red);background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.35) 0 4px,transparent 4px 8px)}
.tl .past{opacity:.35}
.tl .now{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--fg);border-radius:2px;z-index:3}
.tl .arr{position:absolute;top:-6px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--green);border:2px solid var(--night);z-index:3}
.ticks{position:relative;height:15px;font-size:11px;color:var(--dim);font-family:var(--f-num)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ticks span:first-child{transform:none} .ticks span:last-child{transform:translateX(-100%);color:var(--glow2)}
.mini{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;width:100%;padding:6px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--line)}

/* 抽籤 */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:6px}
.chip{font-size:12.5px;border-radius:8px;padding:4px 9px;border:1px solid var(--line);background:var(--panel);display:flex;gap:6px;align-items:baseline;line-height:1.35}
.chip .dim{white-space:nowrap}
.chip.sup{border-left:3px solid var(--green)} .chip.dem{border-left:3px solid var(--soc)}
.chip b{font-weight:700} .chip .q{color:var(--dim);font-family:var(--f-num)}
.drawgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.dcard{border-radius:14px;border:1px solid var(--line);background:var(--panel);padding:12px 14px;display:grid;gap:8px;align-content:start;border-top:4px solid var(--green)}
.dcard.dem{border-top-color:var(--soc)}
.dcard b{font-size:16px}
.dcard .res{font-size:22px;font-weight:900;font-family:var(--f-story);min-height:1.4em;line-height:1.3}
.dcard .res.q{color:var(--dim);font-family:var(--f-num)}
.dcard.rolling .res{color:var(--yellow)}
.dcard.flash{animation:glow 1.6s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(243,197,49,.9)}100%{box-shadow:0 0 0 22px rgba(243,197,49,0)}}
.sidetag{font-size:11.5px;font-weight:700;border-radius:4px;padding:0 6px}
.sidetag.sup{background:var(--green);color:#04170e} .sidetag.dem{background:var(--soc);color:#250810}

/* 卡片 */
.card{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:12px 14px;display:grid;gap:8px}
.card.on{border-color:var(--glow2);background:linear-gradient(150deg,#26220f,var(--panel) 70%)}
.card.live{border-color:var(--green)} .card.coming{border-color:var(--yellow)} .card.fail{border-color:var(--red);opacity:.8}
.card.need{border-left:4px solid var(--red)}
.card h3{font-size:16px}
.kw{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{padding:6px 11px;font-size:14px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{min-width:42px;height:42px;padding:0 8px;font-size:18px}
.stepper .num{min-width:58px;text-align:center;font-size:18px}
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tg{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:transparent}
.tg.on{border-color:var(--orange);color:var(--orange);background:#2a1a10}
.opt{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#0d151b;text-align:left;width:100%}
.opt.sel{border-color:var(--yellow);background:#2a2610;color:var(--fg)}
.opt b{font-family:var(--f-num)}
.scard{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.scard header{padding:12px 16px;background:var(--panel2);border-bottom:1px solid var(--line);display:grid;gap:4px}
.scard .body{padding:12px 16px;display:grid;gap:14px}
.q{display:grid;gap:8px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:620px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:13px}

/* 說明視窗 */
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,6,9,.82);display:grid;place-items:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.story{width:min(620px,100%);max-height:100%;overflow:auto;background:linear-gradient(170deg,#1b1a12,#12181d 45%);border:1px solid #4a4430;border-radius:18px;padding:22px 24px;display:grid;gap:14px}
.story .kicker{font-family:var(--f-num);color:var(--glow2);font-size:13px;letter-spacing:.1em}
.story h2{font-family:var(--f-story);font-size:clamp(22px,4vw,30px);font-weight:900}
.story .text{font-family:var(--f-story);font-size:18px;line-height:1.85;white-space:pre-wrap;min-height:2em}
.story .text.big{font-size:clamp(26px,6vw,36px);font-weight:900;line-height:1.35}
.story .caret::after{content:"▍";color:var(--glow2);animation:blink 1s steps(2,start) infinite}
.story.draw{border-color:var(--yellow);background:linear-gradient(170deg,#2a2510,#12181d 55%)}
.story.alarm{border-color:var(--red);background:linear-gradient(170deg,#2a0e10,#12181d 50%)}

/* 主螢幕 */
.topbar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:stretch;margin-bottom:14px}
.lampbox{display:grid;gap:2px;padding:8px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);min-width:150px}
.lampbox .v{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.bulb{width:15px;height:15px;border-radius:50%;box-shadow:0 0 14px currentColor;background:currentColor;display:inline-block}
.bigclock{display:grid;justify-items:end;padding:6px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.bigclock .t{font-family:var(--f-num);font-size:44px;font-weight:600;line-height:1.05}
.console{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.lights{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.light{border-radius:12px;padding:10px;background:#0d151b;border:1px solid var(--line);display:grid;gap:3px;text-align:center}
.light .b2{width:34px;height:34px;border-radius:50%;margin:0 auto;background:var(--glow2);box-shadow:0 0 20px 5px rgba(255,236,180,.5)}
.light.warn .b2{background:var(--yellow);box-shadow:0 0 14px 3px rgba(243,197,49,.5)}
.light.dark .b2{background:#1a232b;box-shadow:none}
.light b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.newsbox{border-radius:14px;border:1px solid #4a4430;background:linear-gradient(170deg,#1b1a12,#12181d 60%);padding:14px 18px;display:grid;gap:6px}
.newsbox .text{font-family:var(--f-story);font-size:19px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .n{font-family:var(--f-num);font-size:30px;font-weight:600;line-height:1.1}
.bars{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:22px minmax(0,1fr) 30px;gap:8px;align-items:center;font-size:13.5px}
.bar .tr{height:14px;border-radius:7px;background:var(--panel2);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--glow2)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:45;overflow:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 16px;display:grid;gap:14px;align-content:start}
.drawer section{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--yellow);color:#1a1500;border:0;font-weight:700;border-radius:999px;padding:11px 20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--night);padding:9px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:min(560px,calc(100% - 32px));text-align:center}
.form{display:grid;gap:12px} .field{display:grid;gap:6px} .field>label,.field>.lbl{font-weight:700;font-size:14px}
.choicebtns{display:flex;gap:6px;flex-wrap:wrap}
.needlist{display:grid;gap:8px}
.tierchip{font-size:12px;border-radius:4px;padding:0 6px;font-weight:700}
.t1{background:var(--red);color:#1a0505} .t2{background:var(--yellow);color:#1a1500} .t3{background:var(--dim);color:var(--fg)}
.verdictb{display:flex;gap:4px;flex-wrap:wrap} .verdictb button{font-size:12.5px;padding:4px 9px} .verdictb button.on{background:var(--fg);color:var(--night)}
@media (max-width:1000px){ .console{grid-template-columns:minmax(0,1fr)} .topbar{grid-template-columns:minmax(0,1fr) auto} .topbar>div:first-child{grid-column:1/-1} }
@media (max-width:520px){ .bigclock .t{font-size:32px} .story{padding:18px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* v3：三組分工與流程 */
.gpill{font-weight:700}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.stp{font-size:12px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.stp.done{border-color:#24563f;color:var(--green);background:#0f2219}
.stp.wait{border-color:var(--yellow);color:var(--yellow);background:#2a2610;font-weight:700}
.stp.no{border-color:#5a2228;color:#ff9aa0;background:#2a1013}
.todobox{border-radius:14px;border:1px solid var(--yellow);background:#1f1c10;padding:10px 14px;display:grid;gap:6px}
.todobox b{font-size:13px;color:var(--yellow);letter-spacing:.1em}
.todobox button{text-align:left;background:transparent;border:0;border-bottom:1px dashed #4a4430;border-radius:0;padding:6px 2px;font-size:14.5px}
.todobox button:last-child{border-bottom:0}
.ro{border:1px dashed var(--muted);color:var(--muted);border-radius:12px;padding:8px 12px;font-size:13.5px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pipe{width:100%;border-collapse:separate;border-spacing:0 6px;min-width:0;font-size:14px}
.pipe th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:0 6px;border:0}
.pipe td{padding:8px 6px;background:var(--panel);border:0;vertical-align:middle}
.pipe td:first-child{border-radius:10px 0 0 10px;font-weight:700;white-space:nowrap}
.pipe td:last-child{border-radius:0 10px 10px 0}
.cell{font-size:13px;display:inline-block;padding:3px 8px;border-radius:6px;white-space:nowrap}
.cell.done{color:var(--green)} .cell.todobox{color:var(--dim)} .cell.no{color:#ff9aa0;background:#2a1013}
.cell.wait{color:#1a1500;background:var(--yellow);font-weight:700;animation:flash 1.6s ease-in-out infinite}
.grpstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grpstat>div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;border-top:3px solid currentColor}
.grpstat .n{font-family:var(--f-num);font-size:26px;font-weight:600;line-height:1.1}
.drawgrid.compact{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}

function allSources(){
  return [...SOURCES, ...(S.ctl?.pool||[]).filter(x=>x.t==="sup").map(x=>{ const c=S.supply.find(s=>s.id===x.id); return c? { id:"c-"+x.id, name:(c.unit||c.no||"供給卡"), color:"#ffb36b", card:true, kwh:+c.pkwh||0, lead:+c.plead||60, drawAt:x.at } : null; }).filter(Boolean)];
}
const poolOf = t => (t==="need"? S.needs.filter(n=>n.pool && n.pkind && +n.pqty>0) : S.supply.filter(s=>s.pool && +s.pkwh>0));
const poolLeft = t => poolOf(t).filter(c=>!(S.ctl?.pool||[]).some(x=>x.t===t && x.id===c.id));

  const T=simNow();
  if(id==="batt") return (S.ctl?.seg>=1 || S.ctl?.read)? "" : "主持人宣讀情境後";

  if(id==="mobile"||id==="pool-sup") return passed("h2")? "" : "19:00 治理組決定開放門外後";
  if(id==="walkin"||id==="pool-need") return T>=150? "" : "20:00 狀況卡 1-B 後";
  if(id==="swap"||id==="home") return T>=210? "" : "21:00 後";
  if(id==="attack") return (S.ctl?.injects||[]).includes("1C")? "" : "先發出備用卡 1-C";

function drawWaitLabel(id){ const dd=SOURCES.find(z=>z.id===id)?.draw, lk=dd? drawLock(dd) : ""; const hhmm=lk&&lk.match(/\d\d:\d\d/)?.[0]; return hhmm? hhmm+" 後抽籤" : "等主持人抽籤"; }

function ffTarget(){ const c=S.ctl; if(!c || c.seg<1 || c.seg>3 || heldAt()) return null; const e=nextEvent(), seg=SEGS[c.seg]; if(!e || e.at>seg.s1) return null; return e; }

  const segs=[]; for(let m=0;m<SUNRISE;m++){ const l=lit[m], last=segs[segs.length-1]; if(last && last.lit===l) last.b=m+1; else segs.push({ a:m, b:m+1, lit:l }); }
  let firstDark=null; for(let m=Tm;m<SUNRISE;m++) if(!lit[m]){ firstDark=m; break; }
  const supTot=cap+arr.reduce((s,a)=>s+a.kwh,0), demTot=usedNow+fut.t1+fut.t2+fut.t3+fut.out, hrs=Math.max(0,(SUNRISE-T)/60);

  const val={ T, cap, arr, wait, fail, segs, firstDark, darkNow:!lit[Math.min(Tm,SUNRISE-1)], usedNow, kwNow, fut, supTot, demTot, diff:supTot-demTot, unmet, ghost, needs, ok:firstDark==null, out };
  if(ov){ previewCache.key=key; previewCache.val=val; } else runCache={ key, val }; return val;
}

/* ---------- 現在輪到誰（所有畫面共用） ---------- */
const SLOT_ORDER=["host","soc","tech","gov"];
/* 全場唯一的進行順序：一次只有一件「現在」的事（關卡時三組同時） */
function mainQueue(){
  if(!S.ctl || S.ctl.seg<0) return { now:[], q:[] };
  const q=[], seen=new Set(), add=(who,t,par)=>{ const k=who+"|"+t; if(t && !seen.has(k)){ seen.add(k); q.push({who,t,par:!!par}); } };
  const h=heldAt(); if(h) holdWaits(h).forEach(([g,t])=>add(g,t,true));
  const hs=hostSteps();
  hs.filter(x=>/^[①②③⑤] /.test(x.t)).forEach(x=>add("host",x.t.replace(/^[①②③⑤] /,"")));
  if(demoActive()) add("tech","上台示範：降到哪一級、能撐多久");
  if(S.ctl.seg===0 && D("batt") && !demoDone()) add("tech","準備上台示範（主持人開始推演後）");
  allSources().forEach(def=>{ const pp=pipe(def.id); if(!pp.who || (pp.who==="tech" && !pp.p)) return;
    const t = pp.who==="host"? `判定「${def.name}」方案` : pp.who==="soc"? `決定是否使用「${def.name}」` : pp.who==="gov"? `授權「${def.name}」（誰負責、怎麼送達）` : (pp.ret? `回覆${GROUPS[pp.ret.by].name}提問、修正「${def.name}」（第${pp.ver+1}版）` : pp.steps[1].st==="no"? `修改「${def.name}」方案` : "啟用門市衛星（治理組要用來送授權）");
    add(pp.who,t); });
  hs.filter(x=>/^抽|^本段時間到/.test(x.t)).forEach(x=>add("host",x.t));
  ["soc","gov","tech"].forEach(g=>coachList(g).filter(i=>!i.low && !i.nopop && !i.info).forEach(i=>add(g,i.title)));
  const now = q.some(x=>x.par) ? q.filter(x=>x.par) : q.slice(0,1);
  return { now, q };
}
function turnSlots(){
  if(!S.ctl || S.ctl.seg<0) return [];
  const {now,q}=mainQueue();
  return SLOT_ORDER.map(w=>{ const n=now.find(x=>x.who===w); if(n) return [w,n.t,"now"]; const x=q.find(x=>x.who===w); return x? [w,x.t,"next"] : [w,null,"idle"]; });
}

function doPoolDraw(t){

function pickIndex(def){ const ws=def.opts.map(o=>o.w||1), tot=ws.reduce((a,b)=>a+b,0); let r; try{ const u=new Uint32Array(1); crypto.getRandomValues(u); r=u[0]/4294967296*tot; }catch(e){ r=Math.random()*tot; } for(let i=0;i<ws.length;i++){ if(r<ws[i]) return i; r-=ws[i]; } return ws.length-1; }

function tick(){
  if(!S.ctl) return;
  const T=simNow(), c=S.ctl, seg=SEGS[c.seg], red=commRed(T);
  document.querySelectorAll('[data-live="clock"]').forEach(el=>el.textContent=clockLabel(T));
  document.querySelectorAll('[data-live="segname"]').forEach(el=>el.textContent= seg? seg.name+(c.pausedAt?"（暫停）":"") : "等待開始");
  const left=realLeft(), hl=$('[data-live="hostleft"]'); if(hl&&left!=null) hl.textContent=`${String(Math.floor(left/60000)).padStart(2,"0")}:${String(Math.floor(left/1000)%60).padStart(2,"0")}`;
  document.querySelectorAll('[data-live="comm"]').forEach(el=>el.innerHTML=`<span class="eyebrow">通訊</span><span class="v" style="color:var(--${red?"red":"orange"})"><i class="bulb"></i>${red?"中斷":"有限恢復"}</span>`);
  document.querySelectorAll('[data-live="commpill"]').forEach(el=>{ el.innerHTML=`<i class="dot"></i>通訊${red?"中斷":"有限"}`; el.style.color=`var(--${red?"red":"orange"})`; });
  const upd=(sel,html)=>{ const el=$(sel); if(el && el.dataset.k!==html){ el.dataset.k=html; el.innerHTML=html; } };
  if(S.view==="play" && S.me){
    upd('[data-live="bal"]', balHTML(false, previewOn()? demoPreview() : undefined));
    upd('[data-live="mini"]', miniHTML());
    upd('[data-live="draws"]', drawChips());
    upd('[data-live="hold"]', holdHTML(false));
    upd('[data-live="goal"]', S.ctl.seg>=0? goalHTML(false) : "");
    upd('[data-live="end"]', endHTML(false));
    upd('[data-live="notices"]', noticesHTML());
    upd('[data-live="coach"]', coachHTML(myG()));
    upd('[data-live="turn"]', turnHTML(myG(), false));
    checkTurn(myG());
    upd('[data-live="demo"]', demoHTML(isOp("tech")));
    syncMini();
    if(T>=LOCK_UNTIL && $('[aria-disabled="true"][data-act="tier"][data-why^="17:40"]')) setTimeout(scheduleRender,0);
    checkStories();
    checkCoach();
  }
  if(S.view==="console" && c.seg>=0){
    upd('[data-live="hold"]', holdHTML(true));
    upd('[data-live="hcoach"]', hostCoachHTML());
    upd('[data-live="turn"]', turnHTML("host", true));
    checkTurn("host");
    upd('[data-live="goal"]', goalHTML(true));
    upd('[data-live="end"]', endHTML(true));
    upd('[data-live="notices"]', noticesHTML());
    upd('[data-live="cdemo"]', demoState().on? demoHTML(false) : "");
    const h=heldAt(); if(h && !holdWaits(h).length && !S.releasing){ S.releasing=true; release(h).finally(()=>{ S.releasing=false; }); }
    upd('[data-live="bigbal"]', balHTML(true, previewOn()? demoPreview() : undefined));
    upd('[data-live="pipe"]', `<div class="eyebrow" style="margin-bottom:4px">外部電源與授權流程</div>${pipeTable(true)}`);
    upd('[data-live="grp"]', groupStat());
    const nw=$('[data-live="news"]');
    if(nw){ const latest=[...EVENTS.filter(e=>T>=e.t).map(e=>({ t:e.t, title:e.title||"背景事件", text:e.text })), ...SCARDS.filter(cardReleased).map(s=>({ t:s.at??T, title:s.title+"　"+s.sub, text:s.story }))].sort((a,b)=>a.t-b.t).pop();
      const key=latest? latest.title+latest.t : "";
      if(nw.dataset.key!==key){ nw.dataset.key=key; nw.innerHTML = latest? `<div class="eyebrow" style="color:var(--glow2)">${hm(latest.t)}</div><h2 style="font-family:var(--f-story);font-size:20px">${esc(latest.title)}</h2><div class="text" id="newstext"></div>` : "";
        const el=$("#newstext"); if(el){ const full=latest.text; let i=0; clearInterval(nw._t); nw._t=setInterval(()=>{ i+=2; el.textContent=full.slice(0,i); if(i>=full.length) clearInterval(nw._t); },40); } }
    }
  }
}

let toastTimer;
function toast(t){ let el=$(".toast"); if(!el){ el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el); } el.textContent=t; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true,3000); }
const LOCAL=new Set(["rdraft","adraft","resumeg","nopop","coachgo","tab","drawer","cigroup","canceledit","leave","draft","pdraft","ldraft","switchg"]);
const toggleIn=(arr,v)=>{ const s=new Set(arr||[]); s.has(v)?s.delete(v):s.add(v); return [...s]; };
document.addEventListener("click", async ev=>{
  const b=ev.target.closest("[data-act]"); if(!b) return;
  if(b.getAttribute("aria-disabled")==="true"){ ev.preventDefault(); toast(b.dataset.why||"現在不能按"); return; }
  const d=b.dataset, act=d.act;
  if(!dbAPI && !LOCAL.has(act)){ toast("連不上雲端資料庫"); return; }
  const before=balDiff(), T=nowM(); if(!LOCAL.has(act)) S.lastAct=Date.now();
  switch(act){
    case "create": await createRun(($("#newname")?.value||"").trim()); break;
    case "switchrun": await w(dbAPI.doc("config/current").set({ rid:d.id, name:d.name, at:Date.now() })); toast("已切換到「"+d.name+"」"); break;
    case "drawer": S.drawer=!S.drawer; render(); break;
    case "tab": S.tab=d.tab; render(); window.scrollTo({top:0}); break;
    case "leave": S.draft.name=S.me?.name||S.draft.name; S.me=null; ls.set("oasis3-me-"+S.rid,"null"); try{ sessionStorage.removeItem("oasis3-me-"+S.rid); }catch(e){} render(); break;
    case "demodone": { const dd=demoState(); dd.on=false; saveSt("tech",{ demoDone:nowM(), demo:dd }); S.tab="src"; toast("示範完成：接著到「電源方案」送出方案"); render(); window.scrollTo({top:0}); break; }
    case "demo": { const dd=demoState(); if(d.k==="on") dd.on=!dd.on; if(d.k==="load") dd.load=d.v; if(d.k==="src") dd.src=toggleIn(dd.src,d.v); saveSt("tech",{ demo:dd }); runCache.key=""; tick(); break; }
    case "nopop": ls.set("oasis3-nopop", ls.get("oasis3-nopop")==="1"?"0":"1"); toast(ls.get("oasis3-nopop")==="1"?"已關閉提示視窗，提示仍會顯示在畫面上方":"已開啟提示視窗"); tick(); break;
    case "coachgo": ackCoach(d.id); goCoach(d.tab, d.target); break;
    case "resumeg": { const me={ name:S.ops[d.g]?.name||S.draft.name||"", g:d.g }; S.me=me; S.tab=null; S.lastAct=Date.now(); try{ sessionStorage.setItem("oasis3-me-"+S.rid, JSON.stringify(me)); }catch(e){} render(); window.scrollTo({top:0}); break; }
    case "switchg": { S.lastAct=Date.now(); const me={ ...S.me, g:d.g }; S.me=me; S.tab=null; try{ sessionStorage.setItem("oasis3-me-"+S.rid, JSON.stringify(me)); }catch(e){} render(); window.scrollTo({top:0}); break; }
    case "takeover": await becomeOp(S.me.name, S.me.g); render(); break;
    case "cigroup": S.ciGroup=d.g||null; S.edit=null; render(); break;
    case "canceledit": S.edit=null; render(); break;
    case "seg": gotoSeg(S.ctl.seg+(+d.d)); break;
    case "pause": togglePause(); break;
    case "cap": ctlUpdate({ cap:+d.v }); break;
    case "corrvoid": { const reason=($(`[data-input="corrnote"][data-id="${d.id}"]`)?.value||"").trim()||"不符現行規定或技術上不可行"; const name = d.id==="open"? "開放冰箱、插座給門外" : (allSources().find(x=>x.id===d.id)?.name||d.id);
      const text = d.id==="open"? `「${name}」撤銷：${reason}。已接住的門外需求不再計入。` : `「${name}」判為不成立：${reason}。這個電源不再計入供給。`;
      ctlUpdate({ corr:{ ...(S.ctl.corr||{}), [d.id]:{ void:true, reason, at:nowM(), ts:Date.now() } }, notices:[...(S.ctl.notices||[]), { at:nowM(), ts:Date.now(), text:"控制組修正："+text }] }); break; }
    case "corrundo": { const name = d.id==="open"? "開放冰箱、插座給門外" : (allSources().find(x=>x.id===d.id)?.name||d.id); ctlUpdate({ corr:{ ...(S.ctl.corr||{}), [d.id]:{ void:false } }, notices:[...(S.ctl.notices||[]), { at:nowM(), ts:Date.now(), text:`控制組修正：取消「${name}」的修正，恢復原結果。` }] }); break; }
    case "notice": { const t=($(`[data-input="corrnote"][data-id="notice"]`)?.value||"").trim(); if(!t){ toast("請輸入公告內容"); break; } ctlUpdate({ notices:[...(S.ctl.notices||[]), { at:nowM(), ts:Date.now(), text:"控制組公告："+t }] }); break; }
    case "baseline": { const R=run(); ctlUpdate({ baseline:{ ts:Date.now(), at:nowM(), summary:{ lasts: R.ok?"06:00 以後":hm(R.firstDark), supply:+fmt1(R.supTot), demand:+fmt1(R.demTot), sources:R.arr.filter(a=>a.st==="live").map(a=>a.name), voided:Object.entries(S.ctl.corr||{}).filter(([k,v])=>v.void).map(([k,v])=>k+"："+v.reason), notices:(S.ctl.notices||[]).map(n=>n.text) } }, notices:[...(S.ctl.notices||[]), { at:nowM(), ts:Date.now(), text:"控制組：第一階段修正後結果已鎖定，作為第二階段起點。" }] }); toast("已鎖定"); break; }
    case "ff": { const c=S.ctl, seg=SEGS[c.seg], span=seg.s1-seg.s0, at=+d.t; if(!(span>0) || at<seg.s0 || at>seg.s1) break; const now=c.pausedAt||Date.now(); ctlUpdate({ segStart: now-(at-seg.s0)/span*seg.real*60000 }); toast("已快轉到 "+hm(at)); break; }
    case "retlimit": ctlUpdate({ retLimit:+d.v }); break;
    case "readdone": ctlUpdate({ read:true }); break;
    case "draw": if(drawLock(d.id)){ toast(drawLock(d.id)); break; } doDraw(d.id); break;
    case "pooldraw": if(drawLock("pool-"+d.t)){ toast(drawLock("pool-"+d.t)); break; } doPoolDraw(d.t); break;
    case "force": { const h=HOLDS.find(x=>x.id===d.id); if(h) release(h,true); break; }
    case "undraw": ctlUpdate({ draws:{ ...(S.ctl.draws||{}), [d.id]:{ i:null } } }); break;
    case "verdict": { const p=ST("tech").prop?.[d.id]; if(!p) break; const cur=verdictOf(d.id); ctlUpdate({ verdicts:{ ...(S.ctl.verdicts||{}), [d.id]: cur?.v===d.v? null : { v:d.v, at:nowM(), propAt:p.at } } }); break; }
    case "inject": { const s=new Set(S.ctl.injects||[]); s.has(d.id)?s.delete(d.id):s.add(d.id); ctlUpdate({ injects:[...s] }); break; }
    case "clash": ctlUpdate({ clash: +d.i<0? null : +d.i }); break;
    // 草稿（只存在本機，送出才寫入）
    case "draft": S.draft[d.k]= S.draft[d.k]===d.v? null : d.v; render(); break;
    case "pdraft": { const k="p"+d.id, cur=S.draft[k] || JSON.parse(JSON.stringify(ST("tech").prop?.[d.id]||{ safe:[], who:[] })); if(d.multi) cur[d.k]=toggleIn(cur[d.k],d.v); else cur[d.k]= cur[d.k]===d.v? null : d.v; S.draft[k]=cur; render(); break; }
    case "ldraft": { const cur=S.draft.letter||{ scope:[] }; if(d.k==="scope") cur.scope=toggleIn(cur.scope,d.v); else cur.by=cur.by===d.v?null:d.v; S.draft.letter=cur; render(); break; }
    // 社會組
    case "tier": { const tiers={1:true,2:true,3:true,...(ST("soc").tiers||{})}; tiers[d.t]= tiers[d.t]===false; writeStore({ tiers }); render(); break; }
    case "serve": { const n=run().needs.find(x=>x.id===d.id); if(!n) break; const served={...(ST("soc").served||{})}; served[n.id]=Math.max(0,Math.min(n.qty,(served[n.id]||0)+(+d.d))); writeStore({ served }); render(); break; }
    case "use": saveSt("soc",{ use:{ ...(ST("soc").use||{}), [d.id]:{ v:d.v, at:T, ver:verOf(ST("tech").prop?.[d.id]) } } }); render(); break;
    case "unuse": { const u={ ...(ST("soc").use||{}) }; u[d.id]=null; saveSt("soc",{ use:u }); render(); break; }
    case "r17": saveSt("soc",{ r17:{ how:S.draft.r17, at:T } }); S.draft.r17=null; render(); break;
    case "r17undo": saveSt("soc",{ r17:null }); render(); break;
    // 技術組
    case "propose": { const k="p"+d.id, old=ST("tech").prop?.[d.id], dr=S.draft[k] || old; const note=$(`[data-input="pnote"][data-id="${d.id}"]`)?.value||dr.note||""; const dm=demoState(); const pp0=pipe(d.id);
      const ver = old? (pp0.ret? verOf(old)+1 : verOf(old)) : 1, reply = pp0.ret? ($(`[data-input="preply"][data-id="${d.id}"]`)?.value||S.draft["reply"+d.id]||"") : (old?.reply||"");
      const hist={ ...(ST("tech").hist||{}) }; if(old && pp0.ret){ const {hist:_h, ...o}=old; hist[d.id]=[...(hist[d.id]||[]), o]; }
      const np={ ...dr, note, at:T, ver, reply }; delete np.hist;
      if(saveSt("tech",{ prop:{ ...(ST("tech").prop||{}), [d.id]:np }, hist, demo:{ ...dm, on:false } })){ S.draft["reply"+d.id]=null; S.draft[k]=null; toast("已送出，等判定員判定"); } render(); break; }
    case "sat": saveSt("tech",{ sat:{ alloc:S.draft.alloc, at:T } }); S.draft.alloc=null; render(); break;
    case "link": saveSt("tech",{ linkOffAt: d.v==="off" ? (linkOffAt() ?? T) : null }); render(); break;
    // 治理組
    case "mode": saveSt("gov",{ mode:{ v:d.v, at:T } }); render(); break;
    case "letter": saveSt("gov",{ letter:{ ...S.draft.letter, at:T } }); S.draft.letter=null; render(); break;
    case "letterundo": saveSt("gov",{ letter:null }); render(); break;
    case "auth": saveSt("gov",{ auth:{ ...(ST("gov").auth||{}), [d.id]:{ liab:d.v, at:T } } }); render(); break;
    case "rdraft": { const k="r"+d.g+d.id, cur=S.draft[k]||{ tags:[] }; cur.tags=toggleIn(cur.tags,d.v); S.draft[k]=cur; render(); break; }
    case "retgo": { const g=d.g, k="r"+g+d.id, dr=S.draft[k]||{ tags:[] }, q=($(`[data-input="rq"][data-g="${g}"][data-id="${d.id}"]`)?.value||dr.q||"").trim(); if(!q){ toast("請寫下你的問題"); break; }
      if(roundsUsed(d.id)>=retLimit()){ toast("已達退回上限"); break; }
      const ret={ ...(ST(g).ret||{}) }; ret[d.id]=[...(ret[d.id]||[]), { ver:verOf(ST("tech").prop?.[d.id]), at:T, tags:dr.tags||[], q, by:g }];
      if(saveSt(g,{ ret })){ S.draft[k]=null; toast("已退回技術組"); } render(); break; }
    case "adraft": { const k="auth"+d.id, cur=S.draft[k]||{}; cur[d.k]=d.v; S.draft[k]=cur; render(); break; }
    case "authgo": { const dr=S.draft["auth"+d.id]||{}; if(!dr.liab||!dr.how) break; const a={ ...(ST("gov").auth||{}) }; a[d.id]={ liab:dr.liab, at:T, how:dr.how, hAt:T, ver:verOf(ST("tech").prop?.[d.id]) }; if(saveSt("gov",{ auth:a })) S.draft["auth"+d.id]=null; render(); break; }
    case "authno": { const a={ ...(ST("gov").auth||{}) }; a[d.id]={ liab:"不授權", at:T, ver:verOf(ST("tech").prop?.[d.id]) }; saveSt("gov",{ auth:a }); render(); break; }
    case "deliver": { const a={ ...(ST("gov").auth||{}) }; a[d.id]={ ...a[d.id], how:d.v, hAt:T }; saveSt("gov",{ auth:a }); render(); break; }
    case "unauth": { const a={ ...(ST("gov").auth||{}) }; a[d.id]=null; saveSt("gov",{ auth:a }); render(); break; }
    // 狀況卡
    case "choose": { const g=myG(), q=SCARDS.flatMap(s=>s.qs).find(x=>x.id===d.q); const cur=ST(g).answers?.[d.q]?.choice, v= cur===d.v? null : d.v;
      if(!saveAnswer(g,d.q,{ choice:v })) break;
      if(q.applyTiers && v && v!=="C" && simNow()>=LOCK_UNTIL){ writeStore({ tiers: v==="A"? {1:true,2:true,3:false} : {1:true,2:false,3:false} }); toast(v==="A"?"一級＋二級":"只開一級"); }
      if(q.link && v){ saveSt("tech",{ linkOffAt: v==="A" ? (linkOffAt() ?? T) : null }); }
      render(); break; }
    case "sendans": { const g=myG(), el=$(`#ans-${d.q}`); if(saveAnswer(g,d.q,{ text:el?el.value:"", sent:T })) toast("已送出回答"); render(); break; }
    case "tag": { const g=myG(); saveAnswer(g,d.q,{ tags:toggleIn(ST(g).answers?.[d.q]?.tags,d.v) }); render(); break; }
    case "needresult": break;
    case "editcard": { const isTech=S.supply.some(x=>x.id===d.id); S.edit={ kind:isTech?"supply":"need", id:d.id }; render(); window.scrollTo({top:0,behavior:"smooth"}); break; }
    case "delcard": confirmTwice(b,()=>{ const isTech=S.supply.some(x=>x.id===d.id); w(dbAPI.doc(P(isTech?"supply":"needs",d.id)).delete()); if(S.edit?.id===d.id) S.edit=null; }); break;
    case "export": exportData(d.f); break;
  }
  runCache.key="";
  if(["retgo","use","unuse","r17","propose","sat","link","mode","letter","auth","deliver","authgo","authno","choose","sendans","demodone"].includes(act) && S.view==="play" && isOp(myG())){ const g=myG(); setTimeout(()=>{ runCache.key=""; const nx=visCoach(g)[0]; const up=upcoming(g)[0]; turnToast(`<div>✓ 已記錄</div><div class="small">接下來：${esc(nx? nx.title : (up||"看主螢幕，等其他組"))}</div>`); },350); }
  if(before!=null && !LOCAL.has(act)){ const after=balDiff(); if(after!=null && Math.abs(after-before)>=0.05){ S.delta={ v:after-before, at:Date.now() }; tick(); } }
});
function confirmTwice(b,fn){ if(b.dataset.confirm==="1"){ fn(); return; } b.dataset.confirm="1"; const t=b.textContent; b.textContent="確定刪除？"; setTimeout(()=>{ if(b.isConnected){ b.dataset.confirm=""; b.textContent=t; } },3000); }
document.addEventListener("submit", async ev=>{
  const f=ev.target.closest("form[data-form]"); if(!f) return; ev.preventDefault();
  const btn=f.querySelector('[type="submit"]'); if(btn?.getAttribute("aria-disabled")==="true"){ toast(btn.dataset.why); return; }
  if(!dbAPI){ toast("連不上雲端資料庫"); return; }
  if(f.dataset.form==="join"){
    const name=F("j-name").value.trim(), g=f.querySelector('input[name="j-group"]:checked')?.value;
    if(!name){ toast("請輸入名字"); F("j-name").focus(); return; }
    if(!g){ toast("請選擇組別"); return; }
    await becomeOp(name, g); document.activeElement?.blur(); render(); return;
  }
  if(f.dataset.form==="need"){
    const g=f.dataset.g, tier=+(f.querySelector('input[name="n-tier"]:checked')?.value||0);
    const data={ g, unit:F("n-unit").value.trim(), need:F("n-need").value.trim(), tier, kwh:F("n-kwh").value.trim(), ifNot:F("n-ifnot").value.trim(), now:F("n-now").value.trim() };
    if(!data.unit||!data.need){ toast("請填寫單位與需求"); return; }
    if(!tier){ toast("請勾選等級"); return; }
    if(S.edit){ if(await w(dbAPI.doc(P("needs",S.edit.id)).update(data))){ toast("已儲存"); S.edit=null; } }
    else { const no=GROUPS[g].prefix+"-"+String(S.needs.filter(n=>n.g===g).length+1).padStart(2,"0"); if(await w(dbAPI.collection(P("needs")).add({ ...data, no, createdAt:Date.now() }))) toast(`已送出 ${no}`); }
  } else {
    const data={ unit:F("s-unit").value.trim(), provide:[...f.querySelectorAll('input[name="s-prov"]:checked')].map(x=>x.value), scale:F("s-scale").value.trim(), inHour:f.querySelector('input[name="s-inhour"]:checked')?.value||"", limits:[...f.querySelectorAll('input[name="s-lim"]:checked')].map(x=>x.value), needGroup:F("s-need").value.trim() };
    if(!data.unit){ toast("請填寫單位"); return; }
    if(S.edit){ if(await w(dbAPI.doc(P("supply",S.edit.id)).update(data))){ toast("已儲存"); S.edit=null; } }
    else { const no="T-"+String(S.supply.length+1).padStart(2,"0"); if(await w(dbAPI.collection(P("supply")).add({ ...data, no, createdAt:Date.now() }))) toast(`已送出 ${no}`); }
  }
  document.activeElement?.blur(); S.pending=false; f.reset(); render();
});
document.addEventListener("keydown", ev=>{
  const el=ev.target; if(el?.dataset?.input!=="answer" || ev.key!=="Enter" || ev.shiftKey || ev.isComposing || ev.keyCode===229) return;
  ev.preventDefault(); const btn=$(`[data-act="sendans"][data-q="${el.dataset.q}"]`); if(btn){ el.blur(); setTimeout(()=>btn.click(),0); }
});
document.addEventListener("input", ev=>{
  const el=ev.target, d=el.dataset; if(!d.input) return;
  if(d.input==="answer" && dbAPI){ const g=myG(); if(isOp(g)) debounced("a"+d.q,()=>saveAnswer(g,d.q,{ text:el.value })); }
  if(d.input==="rq"){ const k="r"+d.g+d.id; S.draft[k]=S.draft[k]||{ tags:[] }; S.draft[k].q=el.value; }
  if(d.input==="preply"){ S.draft["reply"+d.id]=el.value; }
  if(d.input==="pnote"){ const k="p"+d.id; S.draft[k]=S.draft[k]||JSON.parse(JSON.stringify(ST("tech").prop?.[d.id]||{ safe:[], who:[] })); S.draft[k].note=el.value; }
  if(el.id==="j-name") S.draft.name=el.value;
  if(el.name==="j-group") S.draft.jg=el.value;
});

document.addEventListener("change", ev=>{
  const el=ev.target, d=el.dataset; if(!dbAPI) return;
  if(d.pool) w(dbAPI.doc(P(d.pool==="need"?"needs":"supply",d.id)).update({ pool:el.checked }));
  if(d.pf && el.tagName==="SELECT") w(dbAPI.doc(P(d.coll,d.id)).update({ [d.pf]:el.value }));
  if(d.pf && el.tagName==="INPUT") w(dbAPI.doc(P(d.coll,d.id)).update({ [d.pf]:el.value }));
});

/* ---------- 匯出 ---------- */
const csvCell=v=>{ const s=String(v??""); return /[",\n]/.test(s)? `"${s.replace(/"/g,'""')}"` : s; };
async function exportData(f){
  let dl=null; try{ dl=window.claude?.use? await window.claude.use("downloads") : null; }catch(e){}
  if(!dl){ toast("這個檢視無法下載檔案"); return; }
  const name=(S.ctl?.name||"D1").replace(/[\\/:*?"<>|\s]+/g,"_");
  let data, filename;
  if(f==="json"){ data=JSON.stringify({ run:S.rid, control:S.ctl, groups:S.st, operators:S.ops, needCards:S.needs, supply:S.supply, exportedAt:new Date().toISOString() },null,2); filename=`城市能源綠洲演習_${name}.json`; }
  else {
    const R=run(), L=[["類別","組別","項目","內容","狀態","由誰決定／依據","卡在","情境時間"]];
    DRAWS.forEach(def=>{ const d=D(def.id); L.push(["抽籤","",def.name,d?d.o.l:"未抽","","","",d?hm(d.at):""]); });
    (S.ctl?.pool||[]).forEach(x=>{ const cd=(x.t==="need"?S.needs:S.supply).find(y=>y.id===x.id); if(cd) L.push(["抽籤",x.t==="need"?"需求卡":"供給卡",cd.no,poolLabel(x.t,cd),"","","",hm(x.at)]); });
    Object.entries(S.ctl?.rel||{}).forEach(([k,v])=>{ const h=HOLDS.find(z=>z.id===k); if(h) L.push(["關卡","",h.name,v==="force"?"主持人強制解鎖":"各組完成","","","",hm(h.at)]); });
    (S.ctl?.notices||[]).forEach(n=>L.push(["控制組修正","",n.text,"","","","",hm(n.at)]));
    allSources().forEach(def=>retsOf(def.id,null).forEach(r=>L.push(["退回提問",GROUPS[r.by].name,def.name,`第${r.ver}版：${r.q}`,"","",(r.tags||[]).join("、"),hm(r.at)])));
    L.push(["結果","","門市",R.ok?"撐到日出":R.darkNow?"全黑":hm(R.firstDark)+" 電量耗盡",`供 ${fmt1(R.supTot)}／需 ${fmt1(R.demTot)}`,"","",hm(R.T)]);
    allSources().forEach(def=>{ const pp=pipe(def.id), p=pp.p; L.push(["技術準備清單","技術組",def.id+" "+def.name,p?`${p.method?p.method+"｜":""}${(p.safe||[]).join("、")}｜${p.rule}｜同意：${(p.who||[]).join("、")}｜${p.note||""}`:"未提案",`判定：${pp.v?.v||"—"}｜店長：${pp.u?(pp.u.v==="no"?"不使用":"使用"):"—"}｜責任：${pp.a?.liab||"—"}｜${(pp.steps.find(x=>x.k==="arrive").label)||""}`,"","",p?hm(p.at):""]); });
    const gv=ST("gov"); L.push(["授權","治理組","開放冰箱插座",gv.mode?.v||"未決定",gv.letter?.at!=null?`授權書：${gv.letter.by}｜${(gv.letter.scope||[]).join("、")}`:"","","",gv.mode?hm(gv.mode.at):""]);
    L.push(["通訊資安","技術組","門市衛星",ST("tech").sat?.alloc||"未啟用","","","",satAt()!=null?hm(satAt()):""]);
    L.push(["通訊資安","技術組","能源管理系統連線",linkOffAt()!=null?"暫停":"連線",D("attack")?D("attack").o.l:"","","",linkOffAt()!=null?hm(linkOffAt()):""]);
    R.needs.filter(n=>n.at<=R.T).forEach(n=>L.push(["門外需求","社會組",n.who+"・"+LOADS[n.kind].name,`${Math.min(n.qty,ST("soc").served?.[n.id]||0)}／${n.qty}`,"","","",hm(n.at)]));
    SCARDS.forEach(sc=>sc.qs.forEach(q=>{ const a=ST(q.g).answers?.[q.id]; if(a) L.push(["狀況卡",GROUPS[q.g].name,q.id,q.text,a.choice||"",a.text||"",(a.tags||[]).join("、"),a.t!=null?hm(a.t):""]); }));
    (ST("soc").log||[]).forEach(l=>L.push(["用電","社會組","等級",TIERS.filter(t=>l.tiers?.[t.t]!==false).map(t=>t.name).join("＋")||"全關","","","",hm(l.t)]));
    S.needs.forEach(n=>L.push(["需求卡",GROUPS[n.g]?.name||"",n.no,`${n.unit}｜${n.need}`,["","一級","二級","三級"][n.tier]||"",`${n.kwh}｜${n.ifNot}｜${n.now}`,"",""]));
    S.supply.forEach(s=>L.push(["供給自評","技術組",s.no,`${s.unit}｜${(s.provide||[]).join("、")}`,`一小時內：${s.inHour}`,s.scale,(s.limits||[]).join("、"),""]));
    data="﻿"+L.map(r=>r.map(csvCell).join(",")).join("\n"); filename=`城市能源綠洲演習_${name}.csv`;
  }
  try{ await dl.save({ filename, data }); toast("已下載"); }catch(e){ if(e.code!=="declined") toast("下載失敗："+(e.code||"錯誤")); }
}

/* ============================================================
   啟動
   ============================================================ */
function route(){ S.view=location.hash.replace("#",""); if(!["console","wall","play","checkin"].includes(S.view)) S.view=""; S.drawer=false; S.edit=null; render(); }
window.addEventListener("hashchange",route);
route();
(async()=>{
  let db=null; try{ db=window.claude?.use? await window.claude.use("db") : null; }catch(e){}
  dbAPI=db; S.hasDb=!!db;
  if(!db){ S.ready=true; render(); return; }
  const timer=setTimeout(()=>{ S.stale=true; S.ready=true; render(); },10000);
  db.doc("config/current").onSnapshot(s=>{
    clearTimeout(timer); if(!s.metadata?.fromCache) S.stale=false; S.ready=true;
    const rid=s.exists? s.data().rid : null;
    if(rid!==S.rid) watchRun(rid); else scheduleRender();
  }, e=>{ clearTimeout(timer); S.ready=true; S.writeErr="資料連線失敗（"+e.code+"）"; render(); });
})();
</script>
