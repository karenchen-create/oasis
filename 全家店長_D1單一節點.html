<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全家店長 D1：前金區最後一盞燈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 一個螢幕、不捲動：上＝招牌狀態板｜左＝門市圖板＋設備色塊＋資源卡與需求卡｜右＝這一步｜下＝時間軸與推進。
   字級依螢幕高度縮放，1366×768 筆電到 1920×1080 投影都放得下。 */
:root{
  --blue:#0b69b7; --blue-d:#084f8a; --blue-l:#e6f0fa; --green:#14a24c; --green-d:#0e7d39; --green-l:#e4f5ea;
  --bg:#eef3f6; --ink:#14202b; --ink2:#3f4e5a; --mute:#687784; --line:#d3dde4; --soft:#f5f8fa;
  --yellow:#f2b705; --yellow-l:#fff6d6; --orange:#ec6b1f; --orange-l:#fff0e6; --red:#d7263d; --red-l:#fde8eb;
  --tech:#0b8fb0; --soc:#d8457a; --gov:#6a4fcf;
  --f:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --fs:"Noto Serif TC","Noto Sans TC",serif; --fn:"IBM Plex Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html{font-size:clamp(14px,min(1.95vh,1.12vw),26px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border-radius:.6rem;border:1.5px solid var(--line);background:#fff;padding:.45em .9em;font-weight:500}
button:hover{border-color:var(--blue)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
input,select,textarea{border:1.5px solid var(--line);border-radius:.6rem;padding:.4em .6em;width:100%;background:#fff;min-width:0}
textarea{resize:none}
label{display:grid;gap:.2rem;font-size:.88rem;color:var(--ink2);font-weight:700;min-width:0}
h1,h2,h3,h4{margin:0;text-wrap:balance} p{margin:0}
.num{font-family:var(--fn);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)} .ink2{color:var(--ink2)} .small{font-size:.92rem} .tiny{font-size:.82rem}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap} .between{justify-content:space-between}
.b-blue{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700} .b-blue:hover{background:var(--blue-d)}
.b-green{background:var(--green);border-color:var(--green);color:#fff;font-weight:700} .b-green:hover{background:var(--green-d)}
.b-orange{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}
.b-big{font-size:1.08rem;padding:.6em 1.2em;border-radius:.75rem}
.chip{display:inline-flex;align-items:center;gap:.3em;border-radius:999px;padding:.05em .6em;font-size:.84rem;font-weight:700;white-space:nowrap;border:1.5px solid currentColor}
.chip.ok{color:var(--green-d);background:var(--green-l)} .chip.warn{color:#8a5d00;background:var(--yellow-l)} .chip.bad{color:var(--red);background:var(--red-l)} .chip.gray{color:var(--mute);background:var(--soft)} .chip.blue{color:var(--blue);background:var(--blue-l)}
.who{display:inline-flex;align-items:center;font-weight:900;border-radius:.45rem;padding:.1em .6em;color:#fff;font-size:.92rem;white-space:nowrap}
.who.tech{background:var(--tech)} .who.soc{background:var(--soc)} .who.gov{background:var(--gov)} .who.all{background:var(--ink)} .who.host{background:var(--blue)} .who.ctl{background:var(--orange)}
.flash{animation:flash 1s ease-in-out infinite} @keyframes flash{50%{opacity:.3}}
.pulse{animation:pulse 1.4s ease-in-out infinite} @keyframes pulse{50%{box-shadow:0 0 0 .45rem rgba(242,183,5,.35)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{height:100vh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;overflow:hidden;border-left:.6rem solid;border-right:.6rem solid;border-image:linear-gradient(var(--blue) 0 50%,var(--green) 50% 100%) 1;background:var(--bg)}
.sign{position:relative;background:#fff;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto auto auto;gap:.8rem;align-items:center;padding:.85rem 1rem .75rem}
.sign::before,.sign::after{content:"";position:absolute;left:0;right:0;height:.45rem}
.sign::before{top:0;height:.6rem;background:var(--blue)} .sign::after{bottom:0;height:.35rem;background:var(--green)}
.logo{display:grid;line-height:1}
.logo .fm{font-weight:900;font-size:2.3rem;color:var(--blue);font-style:italic;letter-spacing:-.01em}
.logo .fm span{color:var(--green)}
.logo .zh{font-weight:900;font-size:.9rem;color:var(--ink2);letter-spacing:.24em}
.storename{display:grid;line-height:1.25;border-left:3px solid var(--line);padding-left:.8rem;min-width:0}
.storename b{font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .storename span{font-size:.9rem;color:var(--green-d);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lamp{display:grid;padding:.2rem .65rem;border-radius:.7rem;background:var(--soft);border:1px solid var(--line)}
.lamp .k{font-size:.74rem;color:var(--mute);white-space:nowrap}
.lamp .v{display:flex;align-items:center;gap:.35em;font-weight:900;font-size:.95rem;white-space:nowrap}
.bulb{width:.85em;height:.85em;border-radius:50%;background:currentColor;box-shadow:0 0 .5em currentColor}
.grade-chip{display:grid;justify-items:center;padding:.2rem .7rem;border-radius:.7rem;border:2px solid var(--blue);background:var(--blue-l);cursor:pointer}
.grade-chip .k{font-size:.74rem;color:var(--blue);font-weight:700;white-space:nowrap}
.grade-chip .v{font-weight:900;font-size:1.15rem;color:var(--blue);white-space:nowrap}
.timer{display:grid;justify-items:center;padding:.2rem .6rem;border-radius:.7rem;border:2px solid var(--line)}
.timer.late{border-color:var(--red);background:var(--red-l)}
.timer .k{font-size:.74rem;color:var(--mute);white-space:nowrap} .timer .v{font-family:var(--fn);font-weight:600;font-size:1.2rem;line-height:1.1}
.timer .ctl{display:flex;gap:.2rem} .timer .ctl button{font-size:.74rem;padding:0 .4em;border-radius:.3rem}
.clock{display:grid;justify-items:end;line-height:1}
.clock .d{font-size:.8rem;color:var(--mute);white-space:nowrap} .clock .t{font-family:var(--fn);font-weight:600;font-size:2.4rem}
.ticker{background:var(--ink);color:#fff;font-size:.95rem;padding:.25rem 1.1rem;display:flex;gap:.8rem;white-space:nowrap;overflow:hidden}
.ticker b{color:var(--yellow);flex:none} .ticker span{overflow:hidden;text-overflow:ellipsis}

.main{display:grid;grid-template-columns:minmax(0,55fr) minmax(0,45fr);gap:.7rem;padding:.6rem .8rem;min-height:0}
.left{display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:.6rem;min-height:0}
.card{background:#fff;border:1px solid var(--line);border-radius:.9rem;padding:.6rem .75rem;min-width:0}
.eyebrow{font-size:.8rem;letter-spacing:.12em;color:var(--mute);font-weight:700;white-space:nowrap}

/* 門市圖板 */
.scene{position:relative;border-radius:.9rem;overflow:hidden;background:#0d1822;min-height:0}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.scene .hit{cursor:pointer}
.scene .hit:hover .hl{stroke:#f2b705;stroke-width:5}
.hud{position:absolute;left:.6rem;top:.6rem;background:rgba(255,255,255,.96);border-radius:.8rem;padding:.45rem .7rem;display:grid;gap:.2rem;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:48%}
.hud.alarm{background:#fff0f2;outline:3px solid var(--red)}
.hud .pair{display:flex;gap:1rem;align-items:baseline;flex-wrap:wrap}
.hud .big{font-family:var(--fn);font-size:2.3rem;font-weight:600;line-height:1}
.hud .big small{font-size:.85rem;color:var(--mute)}
.meter{height:.55rem;border-radius:.3rem;background:#e3e9ee;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter i.res{background:repeating-linear-gradient(45deg,#9fd8b4 0 6px,#cdeedb 6px 12px)}
.proj{font-weight:900;font-size:.95rem;border-radius:.4rem;padding:.08rem .45rem;justify-self:start}
.proj.ok{background:var(--green-l);color:var(--green-d)} .proj.warn{background:var(--yellow-l);color:#8a5d00} .proj.bad{background:var(--red-l);color:var(--red)}
.arrivals{position:absolute;right:.6rem;top:.6rem;display:grid;gap:.3rem;max-width:40%}
.arrivals div{background:rgba(255,255,255,.96);border-radius:.6rem;padding:.2rem .5rem;font-size:.86rem;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.svg-flow{stroke-dasharray:8 8;animation:flow 1s linear infinite} @keyframes flow{to{stroke-dashoffset:-16}}
.bob{animation:bob 2.6s ease-in-out infinite} @keyframes bob{50%{transform:translateY(-2px)}}
.fan{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}

/* 設備色塊 */
.blocks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.blocks.focusring{outline:4px solid var(--yellow);outline-offset:4px;border-radius:.9rem;animation:pulse 1.4s infinite}
.blk{border-radius:.8rem;border:2.5px solid var(--line);background:var(--soft);padding:.45rem .6rem;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.15rem .5rem;text-align:left;align-items:center}
.blk.on{background:#fff;border-color:var(--blue)}
.blk b{font-size:1.05rem} .blk.t1 b{color:var(--red)} .blk.t2 b{color:#a87400} .blk.t3 b{color:var(--mute)}
.blk .kw{font-family:var(--fn);font-weight:600;font-size:1.05rem;text-align:right}
.blk .icons{grid-column:1/-1;display:flex;gap:.25rem;overflow:hidden}
.blk .icons span{display:grid;justify-items:center;font-size:.74rem;color:var(--ink2);flex:1 1 0;min-width:0;text-align:center;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .icons svg{width:1.45rem;height:1.45rem}
.blk .state{grid-column:1/-1;font-weight:900;font-size:.88rem;border-radius:.45rem;padding:.15rem .4rem;text-align:center}
.blk.on .state{background:var(--blue);color:#fff} .blk:not(.on) .state{background:#c3ced6;color:#fff}
/* 資源卡與需求卡 */
.tray{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.4rem .6rem;align-items:center}
.tray .lb{font-size:.85rem;font-weight:900;color:var(--ink2);writing-mode:horizontal-tb;white-space:nowrap}
.cards6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.4rem}
.xr{border-radius:.6rem;border:1.5px solid var(--line);padding:.3rem .45rem;display:grid;gap:.05rem;background:#fff;text-align:left;min-width:0}
.xr.live{border-color:var(--green);background:var(--green-l)} .xr.pend{border-color:var(--yellow);background:var(--yellow-l)} .xr.stuck{border-color:var(--red);background:var(--red-l)}
.xr.life{border-left:5px solid var(--red)} .xr.lock{opacity:.6}
.xr b{font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xr .s{font-size:.78rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 右：這一步 */
.flow{display:grid;grid-template-rows:auto auto auto auto minmax(0,1fr) auto;gap:.45rem;min-height:0;border-top:.45rem solid var(--blue)}
.loop{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.25rem}
.loop span{font-size:.8rem;text-align:center;border-radius:.45rem;padding:.2rem .1rem;background:var(--soft);color:var(--mute);border:1.5px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loop span.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:900}
.loop span.done{background:var(--green-l);color:var(--green-d);border-color:var(--green)}
.loop span.injnow{background:var(--orange);color:#fff;border-color:var(--orange);font-weight:900;animation:flash 1.2s infinite}
.kick{font-family:var(--fn);color:var(--blue);font-weight:600;font-size:.95rem}
.flow h2{font-family:var(--fs);font-size:1.55rem;font-weight:900;line-height:1.25}
.beats{display:flex;gap:.25rem;flex-wrap:wrap}
.beats span{font-size:.8rem;border-radius:999px;padding:0 .5em;border:1.5px solid var(--line);color:var(--mute);white-space:nowrap}
.beats span.done{background:var(--green-l);border-color:var(--green);color:var(--green-d)}
.beats span{cursor:pointer}
.beats span.miss{background:#fff1f0;border-color:var(--red);color:var(--red);font-weight:700;animation:flash 1.2s infinite}
.beats span.now{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.body{min-height:0;overflow:auto;display:grid;gap:.55rem;align-content:start}
.story{font-family:var(--fs);font-size:1.15rem;line-height:1.75;white-space:pre-wrap}
.typing::after{content:"▍";color:var(--blue);animation:flash 1s infinite}
.focus{border-radius:.9rem;border:3px solid var(--yellow);background:var(--yellow-l);padding:.7rem .8rem;display:grid;gap:.55rem}
.focus .ask{font-size:1.2rem;font-weight:900;line-height:1.35}
.focus .tag{font-weight:900;color:#8a5d00;font-size:.92rem}
.opts{display:grid;gap:.45rem}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.6rem;align-items:center;text-align:left;padding:.55rem .7rem;border-radius:.75rem;border:2.5px solid var(--line);background:#fff}
.opt .k{width:1.9rem;height:1.9rem;border-radius:.5rem;display:grid;place-items:center;background:var(--soft);font-family:var(--fn);font-weight:600}
.opt .t b{display:block;font-size:1.05rem} .opt .t span{font-size:.86rem;color:var(--ink2)}
.opt.sel{border-color:var(--green);background:var(--green-l)} .opt.sel .k{background:var(--green);color:#fff}
.task{border-radius:.8rem;border:2px solid var(--tech);background:#e8f6fa;padding:.6rem .75rem;display:grid;gap:.35rem}
.task.host{border-color:var(--blue);background:var(--blue-l)}
.task ul{margin:0;padding-left:1.1rem;font-size:1.02rem}
.sumline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem}
.sumline div{background:#fff;border-radius:.6rem;padding:.35rem .5rem;display:grid}
.sumline b{font-family:var(--fn);font-size:1.25rem}
.tags{display:flex;gap:.3rem;flex-wrap:wrap}
.tg{border-radius:999px;padding:.12em .7em;font-size:.86rem;border:1.5px solid var(--line);background:#fff}
.tg.on{border-color:var(--orange);color:var(--orange);background:var(--orange-l);font-weight:700}
.injbar{border-radius:.8rem;border:2.5px solid var(--orange);background:var(--orange-l);padding:.45rem .65rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.injbar b{color:var(--orange)}
.foot{display:flex;gap:.5rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.todo{font-size:.9rem;color:var(--red);font-weight:700}

.bottom{position:relative;background:#fff;border-top:1px solid var(--line);padding:.45rem 1rem .8rem;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.9rem;align-items:center}
.timeline{display:grid;grid-template-columns:10fr 30fr 35fr 35fr 10fr;gap:.35rem;min-width:0}
.tseg{display:grid;gap:.12rem;border-radius:.55rem;padding:.18rem .35rem;background:var(--soft);border:1.5px solid var(--line);min-width:0}
.tseg.on{border-color:var(--blue);background:var(--blue-l)} .tseg.done{border-color:var(--green);background:var(--green-l)}
.tseg .n{font-size:.74rem;font-weight:900;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tseg .ds{display:flex;gap:.2rem;overflow:hidden}
.tseg .ds i{font-style:normal;font-size:.74rem;font-family:var(--fn);border-radius:.3rem;padding:0 .25rem;background:#fff;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.tseg .ds i.done{background:var(--green);border-color:var(--green);color:#fff} .tseg .ds i.now{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}

/* 視窗：一律在一個畫面內 */
.overlay{position:fixed;inset:0;background:rgba(10,20,30,.6);display:grid;place-items:center;z-index:50;padding:2vh 2vw}
.dialog{width:min(64rem,96vw);max-height:94vh;overflow:auto;background:#fff;border-radius:1rem;padding:.85rem 1.2rem;display:grid;gap:.5rem;box-shadow:0 20px 60px rgba(0,0,0,.3);border-top:.6rem solid var(--blue)}
.dialog.soc{border-top-color:var(--soc)} .dialog.gov{border-top-color:var(--gov)} .dialog.all{border-top-color:var(--ink)} .dialog.inj{border-top-color:var(--orange)} .dialog.tech{border-top-color:var(--tech)}
.dialog h2{font-family:var(--fs);font-size:1.4rem;font-weight:900}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem;align-items:start}
.q{display:grid;gap:.3rem} .q .lbl{font-weight:900;font-size:1rem}
.choice{display:flex;gap:.35rem;flex-wrap:wrap}
.choice button{padding:.4em .8em;border-width:2px}
.choice button.sel{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.stance{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.35rem}
.stance button{text-align:left;border-width:2.5px;padding:.4rem .6rem;border-radius:.7rem;font-weight:700}
.stance button.sel{border-color:var(--green);background:var(--green-l)}
.stance.st4{grid-template-columns:repeat(4,minmax(0,1fr))} .stance.st4 button{text-align:center;padding:.35rem .3rem;font-size:.92rem}
.spk{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.spk .grp{border-width:2.5px;font-weight:900}
.spk .grp.tech.on{background:var(--tech);border-color:var(--tech);color:#fff} .spk .grp.soc.on{background:var(--soc);border-color:var(--soc);color:#fff} .spk .grp.gov.on{background:var(--gov);border-color:var(--gov);color:#fff}
.stlist{display:grid;gap:.3rem}
.stlist div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.5rem;align-items:center;border:1.5px solid var(--line);border-radius:.6rem;padding:.25rem .5rem;background:#fff;font-size:.95rem}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem}
.steps3 div{padding:.35rem .55rem;border-radius:.6rem;background:var(--soft);border:1.5px solid var(--line);font-size:.9rem}
.steps3 div b{display:block} .steps3 div.done{background:var(--green-l);border-color:var(--green)}
.warnline{background:var(--yellow-l);border-radius:.6rem;padding:.4rem .7rem;font-size:.95rem;color:#7a5200}
.maker{display:flex;gap:.35rem;flex-wrap:wrap}
.maker button{font-weight:700;border-width:2px;font-size:.95rem}
.maker button.on{color:#fff!important}
.maker .need{border-color:var(--soc);color:var(--soc)} .maker .need.on{background:var(--soc)}
.maker .sup{border-color:var(--green);color:var(--green-d)} .maker .sup.on{background:var(--green)}
.maker .lim{border-color:var(--orange);color:var(--orange)} .maker .lim.on{background:var(--orange)}
.maker .open{border-color:#b08900;color:#8a6a00} .maker .open.on{background:#b08900}
.form{border-radius:.8rem;border:2px solid var(--line);padding:.6rem;display:grid;gap:.45rem;background:var(--soft)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem} .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.45rem}
.quick{display:flex;gap:.3rem;flex-wrap:wrap} .quick button{font-size:.85rem;padding:.15em .55em;border-style:dashed}
.d2{display:grid;gap:.3rem}
.d2 div{border-radius:.55rem;border:1.5px solid var(--line);padding:.3rem .5rem;font-size:.9rem;background:#fff;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.5rem;align-items:center}
.d2 .k{font-weight:900;border-radius:.35rem;padding:0 .45em;color:#fff;font-size:.8rem;white-space:nowrap}
.d2 .k.need{background:var(--soc)} .d2 .k.sup{background:var(--green)} .d2 .k.lim{background:var(--orange)} .d2 .k.open{background:#b08900}
.checklist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.3rem}
.checklist button{text-align:left;border-width:2px;font-size:.9rem;padding:.3rem .55rem}
.checklist button.sel{border-color:var(--soc);background:#fce9f0}
.tabs{display:flex;gap:.35rem}
.tabs button{font-weight:700} .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--line);padding:.3rem .4rem;text-align:left;vertical-align:top}
th{background:var(--soft);color:var(--mute);font-size:.82rem}
td input{padding:.2em .4em;font-size:.8rem}

.score .bar i{display:block;height:100%;background:var(--blue)}

.score .how{font-size:.82rem;color:var(--mute)}
.bigrade{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1rem;align-items:center;border-radius:1rem;padding:.8rem 1rem;background:linear-gradient(90deg,var(--blue-l),#fff)}
.bigrade .L{font-family:var(--fn);font-size:3.4rem;font-weight:600;color:var(--blue);line-height:1}
.toast{position:fixed;left:50%;bottom:5rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.55rem 1.1rem;border-radius:.75rem;z-index:80;font-size:.95rem;max-width:90vw;text-align:center}
.toast.good{background:var(--green-d)} .toast.bad{background:var(--red)}
.black{position:fixed;inset:0;z-index:90;background:#000;display:grid;place-items:center;color:#fff;text-align:center;transition:opacity 1.2s}
.black .l1{font-family:var(--fn);font-size:3.2rem;letter-spacing:.1em}
.black .l2{font-family:var(--fs);font-size:1.5rem;margin-top:1rem;min-height:2.2em}
.black .ats{margin-top:1.2rem;display:inline-grid;grid-auto-flow:column;gap:1rem;align-items:center;opacity:0;transition:opacity .6s}
.black .ats i{display:inline-block;width:3.2rem;height:.4rem;background:#fff3;border-radius:.2rem;position:relative;overflow:hidden}
.black .ats.go i::after{content:"";position:absolute;inset:0;background:var(--yellow);transform:translateX(-100%);animation:zap .6s ease-out forwards}
.black .ats.go i:nth-of-type(2)::after{animation-delay:.6s}
@keyframes zap{to{transform:none}}
.coach{position:fixed;z-index:65;background:#fff;border-radius:.9rem;padding:.8rem 1rem;width:min(26rem,92vw);box-shadow:0 12px 40px rgba(0,0,0,.3);display:grid;gap:.5rem;border-top:.4rem solid var(--green)}
.bottom::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.45rem;background:var(--green)}
.goal{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;border-radius:.7rem;padding:.35rem .65rem;background:var(--blue-l);border:2px solid var(--blue);font-size:.95rem}
.goal b{color:var(--blue-d)} .goal .ok{color:var(--green-d);font-weight:900} .goal .no{color:var(--red);font-weight:900}
.four{display:grid;gap:.4rem} .four .cat{display:grid;grid-template-columns:8.5rem minmax(0,1fr);gap:.4rem;align-items:start}
.four .cat>b{font-size:.95rem;color:var(--soc);padding-top:.25rem}
.sug{display:flex;gap:.35rem;flex-wrap:wrap}
.sug button{border-width:2px;font-size:.92rem;padding:.3em .75em;border-radius:999px}
.sug button.sel{border-color:var(--soc);background:#fce9f0;color:#9b1f4f;font-weight:700}
.satcall{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;border-radius:.7rem;padding:.4rem .6rem;background:#e8fbf0;border:2.5px dashed var(--green);font-weight:700;font-size:.95rem}
.xr.callme{outline:3px solid var(--green);outline-offset:2px;animation:pulse 1.4s infinite}
.stack{display:grid}
.xr.keep{border-color:#9aa8b3;background:var(--soft)}
.addopt{display:inline-flex;gap:.3rem;align-items:center}
.addopt input{width:12.5rem;padding:.3em .8em;border:2px dashed var(--blue);border-radius:999px;background:#f7fbff}
.addopt button{display:none}
.spot{position:fixed;z-index:60;border-radius:1rem;box-shadow:0 0 0 9999px rgba(10,20,30,.62);pointer-events:none}

const isKept=id=>!planned(id)&&!isStuck(id)&&!!G.cards[id]?.skip;
function cardBlock(d){
  if(d.kind==="base") return "";
  const a=G.cards[d.id]?.ans||{}, v=G.cards[d.id]?.verdict;
  for(const q of d.qs||[]){ if(q.type==="count"&&!(a[q.id]>0)) return "先選：幾位車主同意出借"; if(q.type==="choice"&&!a[q.id]) return "先回答：「"+q.text+"」"; if(q.type==="multi"&&!(a[q.id]||[]).length) return "先勾選："+q.text; }
  const nj=d.judge||(d.id==="R1-3"&&a.how?.startsWith("提出"));
  if(nj&&!(v==="可行"||v==="有條件可行")) return v==="不可行"?"技術判定員判定：不可行":"請技術判定員先判定";
  if(d.id==="R1-3"){ if(a.how?.startsWith("等")&&commRed(G.t)) return "通訊紅燈中：業者後台要等 21:00 移動通訊車進駐後才能開通"; if(a.how?.startsWith("用門市衛星")&&!live("R1-5",G.t)) return "要先啟用 R1-5 衛星終端"; }
  if((d.id==="R1-4"||d.channel)&&!(live("R1-5",G.t)||!commRed(G.t))) return "斷訊中聯絡不上：先啟用 R1-5 衛星終端，或等 21:00 通訊恢復";
  if(d.id==="R1-7"&&a.how?.startsWith("透過")&&!live("R1-5",G.t)) return "要先啟用 R1-5 衛星終端";

}

/* ---------- 全家應變中心評等（0～100 分） ----------
   ① 社會福利最大化 30%：依斷電風險加權（製氧機、呼吸器 ×3，疫苗 ×2，胰島素 ×1，手機 ×0.3），接住量 ÷ 已出現的需求量
   ② 電量運用穩定度 25%：未全黑 50 分＋預估撐過日出 30 分＋最低電量維持兩成以上 20 分；每全黑 1 分鐘扣 1 分
   ③ 資源配置效率 20%：缺口覆蓋 40％＋不過度動員 30％＋動員成本 30％（成本＝授權方數＋到位小時）
   ④ 應變速度 15%：降載時間 40＋第一個外部電源 30＋1 小時內基層通報 30
   ⑤ 治理與責任 10%：授權書 40（開放門外後才取得 20）＋點名回應皆有表態 40＋標出卡關原因 20 */
function scoring(){
  const T=G.t, r=run(T,T+48*60), fc={...r};
  const arrived=NEEDS.filter(n=>T>=n.at);
  const wTot=arrived.reduce((s,n)=>s+n.qty*LOADS[n.kind].w,0), wGot=arrived.reduce((s,n)=>s+(G.served[n.id]||0)*LOADS[n.kind].w,0);
  const s1=wTot?Math.round(wGot/wTot*100):(T<90?100:0);
  let s2=(r.dark==null&&r.darkMin===0?50:0)+((r.zero==null||r.zero>=SUNRISE)&&r.dark==null?30:0)+(r.minE/G.cap>=0.2?20:0)-Math.round(r.darkMin||0); s2=Math.max(0,Math.min(100,s2));
  const log=logs(); let needTot=0; for(let t=0;t<SUNRISE;t+=5) needTot+=kwAt(Math.min(t,T),log)*5/60;
  const gap=Math.max(0,needTot-G.cap), M=CARDS.filter(c=>c.kind==="energy"&&planned(c.id)).reduce((s,c)=>s+cardEnergy(c.id),0);
  const cover=gap<=0?1:Math.min(1,M/gap), prec=M<=0?1:Math.min(1,Math.max(gap,0)/M);
  const costMax=CARDS.reduce((s,c)=>s+(c.cost||0)+supV(c.lead||[0,0])/60,0), cost=CARDS.filter(c=>planned(c.id)).reduce((s,c)=>s+(c.cost||0)+supV(c.lead||[0,0])/60,0);
  const s3=Math.round((0.4*cover+0.3*prec+0.3*(1-cost/costMax))*100);
  const shed=log.find(l=>l.tiers?.[3]===false)?.t, firstExt=CARDS.filter(c=>c.kind==="energy"&&planned(c.id)).map(c=>G.cards[c.id].placedAt).sort((a,b)=>a-b)[0], sat=G.cards["R1-5"]?.liveAt;
  const s4=(shed==null?0:shed<=20?40:shed<=60?25:10)+(firstExt==null?0:firstExt<=70?30:15)+(sat==null?0:sat<=60?30:15);
  const servedAt=Math.min(...G.log.filter(l=>Object.values(l.served||{}).some(v=>v>0)).map(l=>l.t),Infinity), au=G.cards["R1-6"]?.liveAt;
  const resp=[]; EVENTS.forEach((e,i)=>{ if(i>G.ev) return; beatsOf(i).forEach((b,j)=>{ if(b.type==="respond"&&(i<G.ev||j<=G.beat)) resp.push(G.rec[bkey(i,j)]); }); });
  const stanced=resp.length?resp.filter(x=>stancesOf(x).length).length/resp.length:0;
  const stuckN=Object.values(G.cards).filter(c=>(c.stuck||[]).length).length+Object.values(G.rec).filter(x=>(x.tags||[]).length).length+G.d2.filter(x=>x.kind==="lim").length;
  const s5=(au==null?0:au<=servedAt?40:20)+Math.round(stanced*40)+(stuckN>0?20:0);
  const S=[
    ["社會福利最大化",s1,30,`依斷電風險加權的接住量 ${fmt1(wGot)}／${fmt1(wTot)}`],
    ["電量運用穩定度",s2,25,`${r.dark!=null?"目前全黑":"未全黑"}・${(r.zero==null||r.zero>=SUNRISE)&&r.dark==null?"可撐過日出":"撐不到日出"}・最低電量 ${fmt1(r.minE)} 度・全黑 ${Math.round(r.darkMin||0)} 分`],
    ["資源配置效率",s3,20,`到日出缺口約 ${fmt1(gap)} 度・已動員 ${fmt1(M)} 度・動員成本 ${fmt1(cost)}／${fmt1(costMax)}`],
    ["應變速度",s4,15,`降載 ${shed==null?"未":hhmm(shed)}・外部電源 ${firstExt==null?"未":hhmm(firstExt)}・基層通報 ${sat==null?"未":hhmm(sat)}`],
    ["治理與責任",s5,10,`授權書 ${au==null?"未取得":hhmm(au)}・表態 ${Math.round(stanced*100)}%・標出卡關 ${stuckN} 處`],
  ];
  const total=Math.round(S.reduce((s,x)=>s+x[1]*x[2]/100,0));
  const L=total>=90?["S","韌性樞紐典範"]:total>=80?["A","穩健應變門市"]:total>=70?["B","可靠民生節點"]:total>=60?["C","待強化節點"]:["D","需全面檢討"];
  return { S, total, L, fc };
}

  st(()=>{ $("#bk2").textContent="……門市偵測到市電中斷"; const a=$("#bk3"); a.style.opacity=1; a.classList.add("go"); },2600);

const COACH=[["#flow","① 右邊：這一步","藍框是本輪目標。一次只出現一件事。黃色框是要選的地方：請技術組決定，主持人代按。沒完成的會顯示紅字，不能推進。"],["#scene","② 門市圖板","左上角是可用電度數與維持小時數。點招牌、空調、冷藏櫃、電動車、換電站都可以操作。"],["#blocks","③ 設備色塊","降載只在這裡操作：點一下開關整組設備。"],["#tray","④ 資源卡與需求卡","資源卡依提出、判定、放置；放置後顯示生效時間。需求卡是門外的人。"],["#nextbtn","⑤ 推進情境時間","這一輪全部完成後才能按，時鐘與電量會一起快轉。"]];
function coach(i=0){
  if(i>=COACH.length){ closeLayer(); G.coached=true; save(); return; }
  const [s,t,d]=COACH[i], el=$(s); if(!el){ coach(i+1); return; }
  const r=el.getBoundingClientRect(), p=6, cw=Math.min(innerWidth*.92,416);
  let left=r.right+14, top=Math.max(10,r.top); if(left+cw>innerWidth-10) left=r.left-cw-14; if(left<10){ left=Math.max(10,Math.min(innerWidth-cw-10,r.left)); top=r.bottom+12; } if(top+220>innerHeight) top=Math.max(10,r.top-230);
  layer(`<div class="spot" style="left:${r.left-p}px;top:${r.top-p}px;width:${r.width+p*2}px;height:${r.height+p*2}px"></div><div class="coach" role="dialog" aria-modal="true" style="left:${left}px;top:${top}px"><span class="eyebrow">怎麼玩・${i+1}／${COACH.length}</span><h3>${esc(t)}</h3><p class="ink2">${esc(d)}</p><div class="row between"><button data-act="coachskip">略過</button><button class="b-blue" data-act="coachnext" data-i="${i+1}">${i+1<COACH.length?"下一個":"開始"}</button></div></div>`);
}

/* ---------- 流程 ---------- */
function snapshot(){ G.history.push(JSON.stringify({...G,history:[]})); if(G.history.length>40) G.history.shift(); }
function beatNext(){ const bs=beatsOf(); if(G.beat<bs.length-1){ snapshot(); G.beat++; startBeat(); save(); render(); enterBeat(); } }
function enterBeat(){ const b=curBeat(); if(!b) return; if(b.type==="story") typeStory(); if(b.type==="respond"){ maker=null; draft={}; spk={g:["tech","soc","gov"].includes(b.who)?b.who:"soc",role:""}; respondDialog(); } if(b.type==="cards"){ maker=null; draft={}; cardsDialog(); } }
function typeStory(){ const k=bkey(), el=$("#storytext"), b=curBeat(); if(!el||typed[k]) return; let i=0; const t=setInterval(()=>{ i+=2; if(!el.isConnected){ clearInterval(t); typed[k]=true; render(); return; } el.textContent=b.text.slice(0,i); if(i>=b.text.length){ clearInterval(t); el.classList.remove("typing"); typed[k]=true; render(); } },30); }
let animating=false;
function advance(){
  if(animating) return; const N=EVENTS[G.ev+1]; if(!N) return;
  snapshot(); const from=G.t, to=N.t, arrivals=CARDS.filter(c=>planned(c.id)&&G.cards[c.id].liveAt>from&&G.cards[c.id].liveAt<=to);
  const finish=()=>{ viewT=null; animating=false; G.ev++; G.beat=0; G.t=to; startBeat(); save(); render();
    arrivals.forEach((c,i)=>setTimeout(()=>toast(`${c.name} 已於 ${hhmm(G.cards[c.id].liveAt)} 生效${c.kind==="energy"?`：+${fmt1(cardEnergy(c.id))} 度`:""}`,"good"),i*1900));
    const e=E(); if(e.beats[0].type==="story"){ typed[bkey(G.ev,0)]=true; storyDialog({ kicker:e.kicker, title:e.title, text:e.beats[0].text },()=>{ render(); beatNext(); }); } else enterBeat(); };
  if(to===from||matchMedia("(prefers-reduced-motion: reduce)").matches){ finish(); return; }
  animating=true; const dur=Math.min(3400,900+(to-from)*25), t0=performance.now();
  const f=now=>{ const k=Math.min(1,(now-t0)/dur); viewT=from+(to-from)*k; render(); if(k<1) requestAnimationFrame(f); else finish(); }; requestAnimationFrame(f);
}
function applyChoice(b,val){

  if(b.apply==="serve"){ const s={...G.served}; ["N2","N3","N4"].forEach(id=>{ s[id]=val.includes(id)?NEEDS.find(n=>n.id===id).qty:0; }); setState({served:s}); }
  if(b.id==="patrol"&&val==="R1-7"){}
}

      else if(d.k==="sup") card={...base,provider:v("m-provider")||F_SUP.provider[0],type:v("m-type")||F_SUP.type[0],cap:v("m-cap"),unit:v("m-unit")||F_SUP.unit[0],when:v("m-when")||F_SUP.when[0],auth:v("m-auth")||F_SUP.auth[0],cond:v("m-cond")};
      else if(d.k==="lim"){ if(!v("m-text")){ toast("請填寫限制內容","bad"); return; } card={...base,cat:v("m-cat")||STUCK[0],rel:v("m-rel")||F_LIM.rel[0],text:v("m-text"),solver:v("m-solver")||F_LIM.solver[0],sug:v("m-sug")}; }
      else { if(!v("m-text")){ toast("請寫下問題","bad"); return; } card={...base,text:v("m-text")}; }
      G.d2.push(card); save(); maker=null; draft={}; inCards?cardsDialog():(closeLayer(),render()); toast(d.k==="open"?"已貼到開放問題欄":"已加入第二階段卡片","good"); break; }
    case "d2del": G.d2=G.d2.filter(x=>x.id!==d.id); save(); if($("#cardsdlg")) cardsDialog(); else resultDialog(); break;
    case "clash": keepText(); G.clash=+d.i; save(); respondDialog(); break;
    case "tier": { if(G.ev<2){ toast("17:40 狀況卡 1-A 之後才能調整","bad"); return; } const t={...G.tiers}; t[d.t]=t[d.t]===false; setState({tiers:t}); render(); break; }
    case "open": resDialog(d.card); break;
    case "ans": { const cur=G.cards[d.card]?.ans?.[d.q]; saveCard(d.card,{ans:{[d.q]:d.num?+d.v:(cur===d.v?null:d.v)}}); resDialog(d.card); break; }
    case "ansmulti": { const s=new Set(G.cards[d.card]?.ans?.[d.q]||[]); s.has(d.v)?s.delete(d.v):s.add(d.v); saveCard(d.card,{ans:{[d.q]:[...s]}}); resDialog(d.card); break; }
    case "verdict": { const cur=G.cards[d.card]?.verdict; saveCard(d.card,{verdict:cur===d.v?null:d.v}); resDialog(d.card); break; }
    case "stuck": { const s=new Set(G.cards[d.card]?.stuck||[]); s.has(d.v)?s.delete(d.v):s.add(d.v); saveCard(d.card,{stuck:[...s]}); resDialog(d.card); break; }
    case "skip": saveCard(d.card,{skip:true}); closeLayer(); render(); break;
    case "go": { const c=CARDS.find(x=>x.id===d.card), lead=supV(c.lead)||0; saveCard(d.card,{liveAt:G.t+lead,placedAt:G.t,skip:false}); closeLayer(); render(); toast(c.kind==="energy"?`${c.name}：${hhmm(G.t+lead)} 生效，+${fmt1(cardEnergy(d.card))} 度`:`${c.name}：${lead?hhmm(G.t+lead)+" 生效":"已生效"}`,"good"); break; }
    case "undo": saveCard(d.card,{liveAt:null,placedAt:null}); closeLayer(); render(); break;
    case "close": closeLayer(); render(); break;
    case "closebg": if(ev.target===b){ closeLayer(); render(); } break;
    case "tools": toolsDialog(); break;
    case "help": closeLayer(); coach(0); break;
    case "coachnext": coach(+d.i); break;
    case "coachskip": closeLayer(); G.coached=true; save(); break;
    case "injskip": G.injSkip[d.id]=true; save(); render(); break;
    case "inject": { if(G.inj[d.id]!=null){ delete G.inj[d.id]; save(); closeLayer(); render(); break; }
      snapshot(); const cb=curBeat(); let pos=beatsOf().slice(0,G.beat+1).filter(x=>!x.inj&&x.type!=="inject").length; if(cb&&!cb.inj&&cb.type!=="inject"&&cb.type!=="story"&&!beatDone(cb,bkey())) pos--; G.inj[d.id]={ev:G.ev,pos}; closeLayer();
      const j=beatsOf().findIndex(x=>x.type==="inject"&&x.id===d.id); if(j>=0){ G.beat=j; startBeat(); } save(); render();
      const I=INJECTS[d.id]; storyDialog({ kicker:"③ 狀況注入・"+hhmm(G.t), title:I.title.replace(/^.*?　/,""), text:I.story, btn:"交給技術組", cls:"inj" }); break; }
    case "cap": G.cap=+d.v; save(); render(); toolsDialog(); break;
    case "scen": G.scen=d.v; save(); render(); toolsDialog(); break;
    case "grade": wallTab="grade"; resultDialog(); break;
    case "result": resultDialog(); break;
    case "walltab": wallTab=d.k; resultDialog(); break;
    case "export": exportData(d.f); break;
    case "back": if(G.history.length){ const h=G.history.pop(), keep=G.history; G={...JSON.parse(h),history:keep}; startBeat(); save(); closeLayer(); render(); } break;
    case "reset": if(b.dataset.ok){ try{ localStorage.removeItem(KEY); }catch(e){} G=fresh(); typed={}; closeLayer(); render(); begin(); } else { b.dataset.ok="1"; b.textContent="確定清除全部紀錄並重新開始？"; } break;
    case "tpause": if(G.pausedAt){ G.beatStart+=Date.now()-G.pausedAt; G.pausedAt=null; } else G.pausedAt=Date.now(); save(); render(); break;
    case "tplus": G.beatStart+=60000; warned=false; save(); tickTimer(); break;
    case "treset": startBeat(); save(); render(); break;
  }
});
function stickyDialog(){ layer(`<div class="overlay" data-act="closebg"><div class="dialog" role="dialog" aria-modal="true" style="width:min(44rem,96vw);border-top-color:#b08900"><div class="row between"><h2>開放問題便利貼</h2><button data-act="close">✕ 關閉</button></div>${makerForm("open")}</div></div>`); }
document.addEventListener("input",ev=>{ const e=ev.target, d=e.dataset;
  if(d.draft) draft[e.id]=e.value;
  if(d.input==="note") setRec(bkey(),{note:e.value});
  if(d.input==="dtext") setRec(bkey(),{text:e.value});
  if(d.input==="fourOther") setRec(bkey(),{fourOther:e.value});
  if(d.input==="vnote") saveCard(d.card,{vnote:e.value});
  if(d.input==="svc"){ G.svc[d.id]={...(G.svc[d.id]||{}),[d.f]:e.value}; save(); } });
document.addEventListener("change",ev=>{ const e=ev.target; if(e.dataset.draft) draft[e.id]=e.value; });
document.addEventListener("keydown",ev=>{ if(ev.key==="Enter"&&ev.target.dataset?.addfor&&!ev.isComposing&&ev.keyCode!==229){ ev.preventDefault(); ev.target.parentElement.querySelector("button").click(); return; } if(ev.key==="Escape"&&$("#layer").innerHTML&&!$("#sd-btn")){ keepText(); closeLayer(); render(); } });
window.addEventListener("resize",()=>{ if(!$(".coach")) render(); });

/* ---------- 匯出 ---------- */
const csv=v=>{ const s=String(v??""); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; };
function exportData(f){
  const stamp=new Date().toISOString().slice(0,16).replace(/[-:T]/g,""); let data,name,type;
  if(f==="json"){ const {history,...r}=G; data=JSON.stringify({...r,score:scoring(),exportedAt:new Date().toISOString()},null,2); name=`全家店長D1_${stamp}.json`; type="application/json"; }
  else{
    const L=[["類別","情境時間","誰","題目／項目","選擇／表態","內容","卡關原因"]];
    EVENTS.forEach((e,i)=>beatsOf(i).forEach((b,j)=>{ const r=G.rec[bkey(i,j)]; if(!r) return;
      if(b.type==="choice"){ const vals=b.multi?(r.value||[]):[r.value]; L.push(["技術組選擇",hhmm(e.t),WHO[b.who][0],b.ask,vals.map(x=>b.opts.find(o=>o[0]===x)?.[1]||x).join("、"),r.note||"",(r.tags||[]).join("、")]); }
      if(b.type==="shed"&&r.done) L.push(["技術組降載",hhmm(e.t),"技術組","降到哪一組",TIERS.filter(x=>r.tiers?.[x.t]!==false).map(x=>x.name).join("＋"),r.note||"",""]);
      if(b.type==="respond") L.push([b.core?"核心議題":"回應與提問",hhmm(e.t),WHO[b.who][0],b.title,[stancesOf(r).map(x=>spkName(x)+"："+stText(x.s)).join("；"),Array.isArray(r.value)?r.value.join("、"):(r.value||""),(r.four||[]).length?`找不到：${r.four.join("、")}`:"",(r.sugg||[]).length?`回答：${r.sugg.join("、")}`:""].filter(Boolean).join("｜"),[r.text,r.fourOther&&("其他找不到的人："+r.fourOther)].filter(Boolean).join("｜"),(r.tags||[]).join("、")]);
      if(b.type==="observe"&&r.note) L.push(["治理組觀察",hhmm(e.t),"治理組",b.title,"",r.note,""]); }));
    CARDS.forEach(d=>{ const c=G.cards[d.id]; if(!c) return; L.push(["資源卡",c.placedAt!=null?hhmm(c.placedAt):"","技術組",`${d.id} ${d.name}`,c.liveAt!=null?`${hhmm(c.liveAt)} 生效`:(isStuck(d.id)?"卡關":c.skip?"保留":"未使用"),Object.entries(c.ans||{}).map(([k,v])=>`${k}:${Array.isArray(v)?v.join("、"):v}`).join("｜")+(c.verdict?`｜技術判定：${c.verdict}${c.vnote?`（${c.vnote}）`:""}`:""),(c.stuck||[]).join("、")]); });
    NEEDS.forEach(n=>{ if(G.served[n.id]) L.push(["需求卡","","",n.title,`接住 ${G.served[n.id]}／${n.qty}`,"",""]); });
    serviceRows().forEach(r=>L.push(["門市服務量表",hhmm(G.t),"",r.c[0],`${r.c[1]}｜${r.c[2]}｜${r.c[3]}`,`前提：${G.svc?.[r.id]?.pre??r.pre}｜是否存在：${G.svc?.[r.id]?.ex??r.ex}`,""]));
    G.d2.forEach(x=>L.push([{need:"第二階段需求卡",sup:"第二階段供給卡",lim:"第二階段限制卡",open:"開放問題"}[x.kind],x.at,x.g,x.kind==="need"?x.target:x.kind==="sup"?`${x.provider}・${x.type}`:x.kind==="lim"?`${x.cat}・${x.rel}`:"",x.kind==="need"?`${x.text}｜${x.qty} ${x.unit}｜${x.tier}｜${x.due}`:x.kind==="sup"?`${x.cap} ${x.unit}｜${x.when}｜需${x.auth}`:x.text,x.kind==="need"?(x.kwh?`每日 ${x.kwh} 度`:""):x.kind==="sup"?x.cond:x.kind==="lim"?`${x.solver}｜${x.sug}`:"",x.kind==="lim"?x.cat:""]));
    const sc=scoring(); L.push(["全家應變中心評等",hhmm(G.t),"","總評",`${sc.L[0]} 級・${sc.L[1]}`,`${sc.total} 分`,""]); sc.S.forEach(([n,s,w,how])=>L.push(["評等指標",hhmm(G.t),"",n,`${s} 分（權重 ${w}%）`,how,""]));
    G.log.forEach(l=>L.push(["用電紀錄",hhmm(l.t),"","設備色塊",TIERS.filter(x=>l.tiers?.[x.t]!==false).map(x=>x.name).join("＋")||"全關",`負載 ${fmt1(loadOf(l))} kW`,""]));
    data="﻿"+L.map(r=>r.map(csv).join(",")).join("\n"); name=`全家店長D1_${stamp}.csv`; type="text/csv";
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); toast("已下載 "+name,"good");
}

/* ---------- 啟動 ---------- */
function begin(){ const e=EVENTS[0]; typed[bkey(0,0)]=true; storyDialog({ kicker:e.kicker, title:e.title, text:e.beats[0].text, btn:"開始：看怎麼玩" },()=>{ render(); coach(0); }); }
render();
if(G.ev===0&&G.beat===0&&!G.coached) begin(); else enterBeat();
</script>
